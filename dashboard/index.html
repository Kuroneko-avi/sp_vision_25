<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combat 控制台</title>
  <link rel="stylesheet" href="./vendor/gridstack/gridstack.min.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <script src="./vendor/mqtt/mqtt.min.js"></script>
  <script src="./vendor/echarts/echarts.min.js"></script>
  <script src="./vendor/gridstack/gridstack-all.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">SP</div>
        <div class="brand-text">
          <strong>SP Vision 控制台</strong>
          <span>MQTT 遥测 · 参数调试 · Panel 工作台</span>
        </div>
      </div>

      <div class="connection-form" aria-label="连接设置">
        <label class="url-field">
          Broker URL
          <input id="broker-url" autocomplete="off" spellcheck="false" aria-describedby="broker-help">
          <span id="broker-help" class="field-help">默认使用当前主机的 9001 WebSocket 端口</span>
        </label>
        <label>
          Robot ID
          <input id="robot-id" autocomplete="off" spellcheck="false" value="myrobot">
          <span class="field-help">用于拼接 MQTT topic</span>
        </label>
        <div class="top-actions">
          <button id="connect" class="primary" type="button">连接</button>
          <button id="disconnect" class="secondary" type="button" disabled>断开</button>
        </div>
        <div class="status" aria-live="polite">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <span id="status-label">未连接</span>
        </div>
      </div>
    </header>

    <main id="dashboard-grid" class="grid-stack" aria-label="Dashboard panel workspace"></main>
  </div>

  <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
