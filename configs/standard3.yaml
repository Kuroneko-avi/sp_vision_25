enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0.2 # degree -2.5
pitch_offset: 0.5 # degree 2
comming_angle: 55 # degree
leaving_angle: 15 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.065 # s
low_speed_delay_time: 0.052 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 1.5 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.2491px
camera_matrix: [2403.7485301241531, 0, 726.49819554477131, 0, 2379.6279310173463, 569.79021177313939, 0, 0, 1]
distort_coeffs: [-0.14832745634699146, 0.24250440433561063, -0.00062117617323155364, 0.00037114921180978058, 0]

# 相机同理想情况的偏角: yaw-1.72 pitch-1.24 roll1.24 degree
# 标定板到世界坐标系原点的水平距离: 0.90 m
# 标定板同竖直摆放时的偏角: yaw47.87 pitch0.83 roll-2.16 degree
R_camera2gimbal: [0.029526424514503324, -0.022209986753895829, 0.99931722027781622, -0.99933058498407445, 0.020948454053741652, 0.029992402173638688, -0.021600281729096706, -0.99953383072367785, -0.021576586107945914]
t_camera2gimbal: [0.031896413223523871, -0.0012259075707201866, 0.098078535217175258]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----curve_generator参数-----#####
curve_generator:
  amplitude_deg: 10.0      # 单周期内 target_yaw 从 -amplitude_deg 扫到 +amplitude_deg
  frequency_hz: 0.2        # target_yaw 周期频率
  pitch_frequency_hz: 0.1  # target_pitch 阶跃切换频率
  pitch_low_deg: -2.0      # target_pitch 阶跃低电平
  pitch_high_deg: 2.0      # target_pitch 阶跃高电平

#####-----plotter-----#####
plotter:
  host: "127.0.0.1" # PlotJuggler UDP host, change to Windows LAN IP for cross-device debug
  port: 9870

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_fyt_detector参数-----#####
buff_fyt_detector:
  model: "assets/yolox_rune_3.6m.xml"
  device_type: "CPU"
  confidence_threshold: 0.7
  top_k: 128
  nms_threshold: 0.3
  detect_r_tag: true
  min_lightness: 90
  r_tag_roi_half_size: 120
  r_tag_max_distance: 80
  r_tag_min_area: 12

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700 # s
predict_time: 0.120 # s

#####-----dashboard参数-----#####
dashboard:
  enabled: false
  robot_id: "myrobot"
  mqtt_host: "tcp://127.0.0.1:1883"
