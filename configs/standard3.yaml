# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0.2 # degree -2.5
pitch_offset: 0.5 # degree 2
comming_angle: 55 # degree
leaving_angle: 15 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.065 # s
low_speed_delay_time: 0.02 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 1.5 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 1.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.2967px
camera_matrix: [2366.1728169568778, 0, 694.05494933677085, 0, 2336.9340923343043, 533.38847693639525, 0, 0, 1]
distort_coeffs: [-0.095525266075741716, 0.3499005960773981, 0.0039465376952549872, -0.005397721996039162, 0]

# 相机同理想情况的偏角: yaw-0.62 pitch-3.90 roll-1.49 degree
# 标定板到世界坐标系原点的水平距离: 1.05 m
# 标定板同竖直摆放时的偏角: yaw66.64 pitch7.36 roll-0.25 degree
R_camera2gimbal: [0.012657898717088915, -0.067635593803698588, 0.99762979308503474, -0.99958481683787492, -0.026682502792713739, 0.010873729438826897, 0.025883808592630189, -0.99735323255882524, -0.06794525706185954]
# t_camera2gimbal: [0.081921107128163112, 0.011818016217254618, -0.054264806335952293]
t_camera2gimbal:  [0.03675, -0.0519, -0.03675]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 44.2
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 74.6
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----plotter-----#####
plotter:
  host: "127.0.0.1" # PlotJuggler UDP host, change to Windows LAN IP for cross-device debug
  port: 9870

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_fyt_detector参数-----#####
buff_fyt_detector:
  model: "assets/yolox_rune_3.6m.xml"
  device_type: "CPU"
  confidence_threshold: 0.7
  top_k: 128
  nms_threshold: 0.3
  detect_r_tag: true
  min_lightness: 90
  r_tag_roi_half_size: 120
  r_tag_max_distance: 80
  r_tag_min_area: 12

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700 # s
predict_time: 0.120 # s

#####-----dashboard参数-----#####
dashboard:
  enabled: false
  robot_id: "myrobot"
  mqtt_host: "tcp://127.0.0.1:1883"

#####-----curve_generator参数-----#####
curve_generator:
  amplitude_deg: 10.0      # 单周期内 target_yaw 从 -amplitude_deg 扫到 +amplitude_deg
  frequency_hz: 0.2        # target_yaw 周期频率
  pitch_frequency_hz: 0.1  # target_pitch 阶跃切换频率
  pitch_low_deg: -2.0      # target_pitch 阶跃低电平
  pitch_high_deg: 2.0      # target_pitch 阶跃高电平
