# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####                                                             
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0.2 # degree -2.5
pitch_offset: 0.5 # degree 2
comming_angle: 55 # degree
leaving_angle: 15 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.065 # s
low_speed_delay_time: 0.052 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 1.5 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1448px
camera_matrix: [2362.2795952460974, 0, 679.17513921636282, 0, 2336.1916035376717, 529.06858905837635, 0, 0, 1]
distort_coeffs: [-0.098561592108101559, 0.11173066531932681, -0.0038352945867108721, -0.0020421443354436304, 0]

# 相机同理想情况的偏角: yaw-0.63 pitch0.97 roll-3.52 degree
# 标定板到世界坐标系原点的水平距离: 1.37 m
# 标定板同竖直摆放时的偏角: yaw-0.38 pitch13.64 roll0.29 degree
R_camera2gimbal: [0.0099221388881537854, 0.017532917182546348, 0.99979705339381442, -0.99806585189505803, -0.061188553025633322, 0.010977989780513252, 0.061368611202112032, -0.99797222295698162, 0.01689188460251817]
t_camera2gimbal: [0.17004338298276647, -0.051908301996077752, 0.0064713491010220305]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----plotter-----#####
plotter:
  host: "127.0.0.1" # PlotJuggler UDP host, change to Windows LAN IP for cross-device debug
  port: 9870

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_fyt_detector参数-----#####
buff_fyt_detector:
  model: "assets/yolox_rune_3.6m.xml"
  device_type: "CPU"
  confidence_threshold: 0.7
  top_k: 128
  nms_threshold: 0.3
  detect_r_tag: true
  min_lightness: 90
  r_tag_roi_half_size: 120
  r_tag_max_distance: 80
  r_tag_min_area: 12

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s

#####-----dashboard参数-----#####
dashboard:
  enabled: false
  robot_id: "myrobot"
  mqtt_host: "tcp://127.0.0.1:1883"
